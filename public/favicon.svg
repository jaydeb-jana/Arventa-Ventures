<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-opacity="0.4"/>

  <!-- Logo Mark (Stylized AV monogram) -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Letter A left diagonal -->
    <path d="M-90 110 L-20 -90 L15 -90 L-55 110 Z" fill="url(#accent-grad)"/>
    
    <!-- Letter A right diagonal extending down to form V right wing -->
    <path d="M-20 -90 L20 -90 L90 110 L50 110 Z" fill="url(#accent-grad)"/>

    <!-- Letter A horizontal crossbar / dynamic stroke -->
    <path d="M-75 50 L35 50 L15 15 L-60 15 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Intersecting V left diagonal cutting through with crisp modern gap -->
    <path d="M-10 -20 L30 -20 L-20 110 L-60 110 Z" fill="url(#accent-grad)"/>
  </g>

  <!-- Top accent dot -->
  <circle cx="360" cy="140" r="22" fill="url(#accent-grad)"/>
</svg>
