<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arventa Ventures - Premier Digital Marketing Agency</title>
    <meta name="description" content="Arventa Ventures is a top-rated digital marketing agency delivering high-ROI SEO, Meta Ads, Google Ads, and Performance Marketing for businesses worldwide." />
    <meta name="keywords" content="Digital Marketing Agency, SEO Services, Performance Marketing, Meta Ads, Google Ads, Growth Hacking, Arventa Ventures" />
    <meta name="author" content="Arventa Ventures" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="https://arventaventures.online" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arventaventures.online/" />
    <meta property="og:title" content="Arventa Ventures - Premier Digital Marketing Agency" />
    <meta property="og:description" content="Arventa Ventures is a top-rated digital marketing agency delivering high-ROI SEO, Meta Ads, Google Ads, and Performance Marketing." />
    <meta property="og:image" content="https://arventaventures.online/images/arventa-og-banner.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://arventaventures.online/" />
    <meta property="twitter:title" content="Arventa Ventures - Premier Digital Marketing Agency" />
    <meta property="twitter:description" content="Arventa Ventures is a top-rated digital marketing agency delivering high-ROI SEO, Meta Ads, Google Ads, and Performance Marketing." />
    <meta property="twitter:image" content="https://arventaventures.online/images/arventa-og-banner.webp" />

    <!-- Google Search & Browser Favicons (Circular Fitted, Multi-Resolution) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon-48.png" />

    <!-- Preconnects for fast rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme Detection Script (Defaults to dark theme for Arventa Ventures brand aesthetic) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
